name: CI

# Runs the unit tests and the template compile harness on every PR and on pushes to main.
# The harness compiles each language's templates in references/*.md against the pinned Waffo
# SDKs, so any drift (phantom fields, wrong methods, unhandled checked exceptions, missing
# required fields) fails the build — the class of defect that shipped undetected before this existed.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.21'
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Unit tests (enforcement verifier)
        run: npm run test:unit

      - name: Template compile harness (strict — all 5 languages must compile)
        run: node tests/compile-templates.mjs --strict
        env:
          WAFFO_HARNESS_STRICT: '1'
