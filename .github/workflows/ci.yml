name: CI

# Runs the unit tests and the template compile harness on every push / PR. The harness
# compiles each language's templates in references/*.md against the pinned Waffo SDKs, so
# any drift (phantom fields, wrong methods, unhandled checked exceptions, missing required
# fields) fails the build — the class of defect that shipped undetected before this existed.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Optional: deeper Python type checking (py_compile always runs without these).
      - name: Install Python type tooling
        run: pip install pyright waffo || true

      - name: Unit tests (enforcement verifier)
        run: npm run test:unit

      - name: Template compile harness (strict — all 4 languages must compile)
        run: node tests/compile-templates.mjs --strict
        env:
          WAFFO_HARNESS_STRICT: '1'
