name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify internal links
        run: |
          # Check all markdown links in docs/ and SKILL.md point to existing files
          error=0
          for file in SKILL.md docs/*.md; do
            grep -oP '\((?:\.\./)?(references/[^)]+|docs/[^)]+)\)' "$file" 2>/dev/null | tr -d '()' | while read link; do
              path=${link%%#*}
              # Resolve relative path from the file's directory
              dir=$(dirname "$file")
              target=$(cd "$dir" && realpath -m "$path" 2>/dev/null || echo "$dir/$path")
              if [ ! -f "$target" ]; then
                echo "BROKEN LINK: $file -> $link (resolved: $target)"
                exit 1
              fi
            done || error=1
          done
          if [ $error -ne 0 ]; then
            echo "::error::Broken internal links found. Fix before publishing."
            exit 1
          fi
          echo "All internal links valid."

      # Full release gate: the templates in references/*.md must compile against the
      # pinned Waffo SDKs in every language before anything is published. --strict makes
      # a missing toolchain/SDK a hard failure (never a silent skip), so a tag can never
      # publish a package whose templates don't actually compile.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python type tooling
        run: pip install pyright waffo || true

      - name: Unit tests (enforcement verifier)
        run: npm run test:unit

      - name: Template compile harness (strict — all 4 languages must compile before publish)
        run: node tests/compile-templates.mjs --strict
        env:
          WAFFO_HARNESS_STRICT: '1'

      - name: Debug npm publish context
        run: |
          echo "package: $(node -p "require('./package.json').name")"
          echo "version: $(node -p "require('./package.json').version")"
          echo "registry: $(npm config get registry)"
          echo "npm whoami:"
          npm whoami
          echo "published latest:"
          npm view @waffo/waffo-integrate version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
